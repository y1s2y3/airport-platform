<svg width="164" height="138" viewBox="0 0 164 138" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- HQ decorative rings -->
  <ellipse cx="82" cy="76" rx="67" ry="53" stroke="url(#ringOuter)" stroke-width="1.34" fill="none"/>
  <ellipse cx="82" cy="70" rx="57" ry="43" stroke="url(#ringInner)" stroke-width="1.34" fill="none"/>

  <!--
    三级环图（重大 / 较大 / 一般），色值对齐 HQ_HAZARD_LEVEL_SEGMENTS
    圆心 (82,70) 外径 40 内径 23
    示意占比：一般 50% · 较大 30% · 重大 20%（静态示意；旁侧图例仍跟真实数据）
  -->

  <!-- 一般 #1498F6：0°→180°（上→右→下） -->
  <path
    d="M82 30
       A40 40 0 1 1 82 110
       L82 93
       A23 23 0 1 0 82 47
       Z"
    fill="#1498F6"
  />

  <!-- 较大 #E6A23C：180°→288°（下→左） -->
  <path
    d="M82 110
       A40 40 0 0 1 43.96 57.64
       L60.13 62.89
       A23 23 0 0 0 82 93
       Z"
    fill="#E6A23C"
  />

  <!-- 重大 #F56C6C：288°→360°（左→上） -->
  <path
    d="M43.96 57.64
       A40 40 0 0 1 82 30
       L82 47
       A23 23 0 0 0 60.13 62.89
       Z"
    fill="#F56C6C"
  />

  <!-- soft highlights -->
  <path
    d="M82 30
       A40 40 0 0 1 118.28 50
       L102.81 58.5
       A23 23 0 0 0 82 47
       Z"
    fill="#5EC1FF"
    fill-opacity="0.28"
  />
  <path
    d="M82 110
       A40 40 0 0 1 60 100.5
       L69.4 87.8
       A23 23 0 0 0 82 93
       Z"
    fill="#F0C078"
    fill-opacity="0.3"
  />

  <!-- slice gaps -->
  <path d="M82 70 L82 30" stroke="rgba(11,23,48,0.92)" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M82 70 L82 110" stroke="rgba(11,23,48,0.92)" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M82 70 L43.96 57.64" stroke="rgba(11,23,48,0.92)" stroke-width="2.4" stroke-linecap="round"/>

  <!-- center disk（数字由 Vue 叠在中间） -->
  <circle cx="82" cy="70" r="21" fill="#0B1730"/>
  <circle cx="82" cy="70" r="21" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>

  <defs>
    <linearGradient id="ringOuter" x1="15" y1="76" x2="149" y2="76" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7B7B7B"/>
      <stop offset="0.5" stop-color="#E5E5E5"/>
      <stop offset="1" stop-color="#7B7B7B"/>
    </linearGradient>
    <linearGradient id="ringInner" x1="25" y1="70" x2="139" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7B7B7B"/>
      <stop offset="0.28" stop-color="#E5E5E5"/>
      <stop offset="0.72" stop-color="#E5E5E5"/>
      <stop offset="1" stop-color="#7B7B7B"/>
    </linearGradient>
  </defs>
</svg>
